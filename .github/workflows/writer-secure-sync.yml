name: Writer Secure Sync

on:
  pull_request:
    paths:
      - 'writer version/**'
      - '.github/workflows/writer-secure-sync.yml'
  push:
    branches:
      - main
      - 'feat/**'
      - 'test/**'
    paths:
      - 'writer version/**'
      - '.github/workflows/writer-secure-sync.yml'

jobs:
  secure-sync:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: writer
          POSTGRES_PASSWORD: writer
          POSTGRES_DB: writer_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U writer -d writer_sync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: writer version/server

    env:
      DATABASE_URL: postgresql://writer:writer@localhost:5432/writer_sync_test
      TEST_DATABASE_URL: postgresql://writer:writer@localhost:5432/writer_sync_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: writer version/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck

      - name: Apply migrations
        run: npm run prisma:deploy

      - name: Test secure sync access
        run: npm run test:access
